stages: [lint, scan, deploy]

lint:
  image: cytopia/ansible-lint
  stage: lint
  script:
    - ansible-lint ansible/playbooks

gitleaks:
  image: zricethezav/gitleaks:latest
  stage: scan
  script:
    - gitleaks detect --source . --redact --no-banner

deploy:
  image: alpine:3.19
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client python3 py3-pip jq curl
    - pip install ansible hvac
    - ansible-galaxy collection install community.hashi_vault community.crypto
  script:
    - test -n "$VAULT_ADDR" -a -n "$VAULT_ROLE_ID" -a -n "$VAULT_SECRET_ID"
    - ansible-playbook -i ansible/inventory.ini ansible/playbooks/pki-automation-approle.yml
    - ansible-playbook -i ansible/inventory.ini ansible/site.yml --skip-tags nagios
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    ANSIBLE_HOST_KEY_CHECKING: "False"
